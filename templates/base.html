<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus — Mode Controller</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%235856d6'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23ffffff'/%3E%3C/svg%3E">
    <script>
        // Apply saved/system theme before first paint to avoid a flash.
        (function () {
            var fromUrl = new URLSearchParams(window.location.search).get('theme');
            var saved = null;
            try { saved = localStorage.getItem('focus-theme'); } catch (e) {}
            var theme = (fromUrl === 'dark' || fromUrl === 'light')
                ? fromUrl
                : saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-{{ page|default('dashboard') }}">
    <div class="mac-window">
        <header class="titlebar">
            <div class="traffic-lights" aria-hidden="true">
                <span class="tl tl-close"></span>
                <span class="tl tl-min"></span>
                <span class="tl tl-max"></span>
            </div>
            <a class="titlebar-title" href="{{ url_for('main.index') }}">Focus</a>
            <div class="titlebar-right">
                <nav class="segmented" aria-label="Primary">
                    <a class="seg {% if page|default('dashboard') == 'dashboard' %}active{% endif %}" href="{{ url_for('main.index') }}">Dashboard</a>
                    <a class="seg {% if page|default('dashboard') == 'history' %}active{% endif %}" href="{{ url_for('main.history_page') }}">History</a>
                    <a class="seg {% if page|default('dashboard') == 'settings' %}active{% endif %}" href="{{ url_for('main.settings_page') }}">Settings</a>
                </nav>
                <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle light/dark theme">
                    <span class="theme-icon theme-icon-light" aria-hidden="true">☀</span>
                    <span class="theme-icon theme-icon-dark" aria-hidden="true">☾</span>
                </button>
            </div>
        </header>

        <main class="window-body">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        document.getElementById('themeToggle').addEventListener('click', function () {
            var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            try { localStorage.setItem('focus-theme', next); } catch (e) {}
            window.dispatchEvent(new CustomEvent('themechange', { detail: { theme: next } }));
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
