{% extends "base.html" %}
{% set page = 'dashboard' %}
{% block content %}
<section class="card permission-banner hidden" id="permissionBanner">
	<h2>Permissions Needed</h2>
	<p id="permissionText"></p>
</section>

<section class="dash-grid">
	<article class="card timer-card" id="timerCard">
		<p class="session-label" id="sessionLabel">FOCUS</p>

		<div class="timer-ring-wrap">
			<svg class="timer-ring" viewBox="0 0 260 260" aria-label="Pomodoro timer ring">
				<circle class="ring-bg" cx="130" cy="130" r="110"></circle>
				<circle class="ring-progress" id="ringProgress" cx="130" cy="130" r="110"></circle>
			</svg>
			<div class="timer-center">
				<span id="timeDisplay">25:00</span>
				<span class="dot-row" id="pomodoroDots" aria-label="Pomodoro cycle progress">○○○○</span>
			</div>
		</div>

		<div class="controls">
			<button id="startBtn" class="btn btn-primary">Start Focus</button>
			<button id="pauseBtn" class="btn">Pause</button>
			<button id="skipBtn" class="btn">Skip</button>
		</div>

		<p id="timerStatus" class="timer-status" aria-live="polite"></p>
	</article>

	<aside class="widget-col">
		<article class="card widget clock-widget">
			<p class="clock-time" id="clockTime">--:--</p>
			<p class="clock-date" id="clockDate">&nbsp;</p>
		</article>

		<article class="card widget">
			<h3 class="widget-title">Today</h3>
			<div class="widget-stats">
				<div class="ws"><span class="ws-value" id="todayFocus">0m</span><span class="ws-label">Focus</span></div>
				<div class="ws"><span class="ws-value" id="todaySessions">0</span><span class="ws-label">Sessions</span></div>
				<div class="ws"><span class="ws-value" id="streakDays">0</span><span class="ws-label">Streak</span></div>
			</div>
		</article>

		<article class="card widget">
			<h3 class="widget-title">This Week</h3>
			<div class="mini-chart" id="weekChart"></div>
		</article>

		<article class="card widget">
			<h3 class="widget-title">Utilities</h3>
			<ul class="util-list" id="utilList"></ul>
		</article>

		<article class="card widget">
			<h3 class="widget-title">Blocklist</h3>
			<p class="block-count"><span id="blockCount">0</span> sites silenced during focus</p>
			<div class="chip-row" id="blockChips"></div>
		</article>
	</aside>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
